<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="zye-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antennas / Ears -->
  <polygon points="18,35 14,8 24,25" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="14,40 10,20 18,32" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5" stroke-linejoin="round" />
  
  <polygon points="82,35 86,8 76,25" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="86,40 90,20 82,32" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Cube Head Base -->
  <rect x="20" y="28" width="60" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />

  <!-- Grid Pattern on Cube -->
  <!-- Vertical lines -->
  <line x1="32" y1="28" x2="32" y2="88" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />
  <line x1="44" y1="28" x2="44" y2="88" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />
  <line x1="50" y1="28" x2="50" y2="88" stroke="#60a5fa" stroke-width="1.8" />
  <line x1="56" y1="28" x2="56" y2="88" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />
  <line x1="68" y1="28" x2="68" y2="88" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />

  <!-- Horizontal lines -->
  <line x1="20" y1="40" x2="80" y2="40" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />
  <line x1="20" y1="52" x2="80" y2="52" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />
  <line x1="20" y1="64" x2="80" y2="64" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />
  <line x1="20" y1="76" x2="80" y2="76" stroke="#93c5fd" stroke-width="1.2" opacity="0.75" />

  <!-- Top notch fold -->
  <polygon points="46,28 50,33 54,28" fill="#334155" />

  <!-- Glowing Eyes -->
  <g filter="url(#glow)">
    <!-- Left Eye -->
    <path d="M 30,58 A 7,7 0 0,1 44,58 Z" fill="url(#zye-eye)" stroke="#78350f" stroke-width="1.2" />
    <!-- Right Eye -->
    <path d="M 56,58 A 7,7 0 0,1 70,58 Z" fill="url(#zye-eye)" stroke="#78350f" stroke-width="1.2" />
  </g>

  <!-- Big Cheerful Smile -->
  <path d="M 32,68 Q 50,83 68,68 Q 50,75 32,68 Z" fill="#451a03" stroke="#1c1917" stroke-width="1.5" />
</svg>